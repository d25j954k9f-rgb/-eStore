(function () {
  'use strict';
  function el(id) { return document.getElementById(id); }
  var titles = ['¡Estrena tu próximo iPhone al mejor precio!','iPhone nuevos y seminuevos con garantía 🍎','¡Tenemos el iPhone que estás buscando!','iPhone desde el 13 hasta el 18 Pro Max','¡Renueva tu iPhone con eStore!','Apple iPhone | Excelentes precios y garantía','¡Tu próximo iPhone te está esperando!','iPhone en venta | Diferentes modelos y capacidades','¡Cotiza tu iPhone con nosotros!','iPhone disponibles en Chihuahua 🍎','¡Estrena iPhone con pagos de hasta 12 meses!','Venta de iPhone | Nuevos y seminuevos','¡Mejoramos cualquier precio en iPhone!','Encuentra tu iPhone ideal en eStore','¡Estrena tecnología Apple al mejor precio!','iPhone con garantía y facilidades de pago','¡Es momento de renovar tu iPhone!','iPhone para diferentes presupuestos'];
  var starts = ['Venta de iPhone','Estrena tu iPhone','Encuentra tu próximo iPhone','iPhone en eStore','Renueva tu iPhone'];
  var ends = ['con garantía incluida','en Chihuahua','con opciones de pago','a excelentes precios','en diferentes modelos y capacidades','con atención personalizada'];
  for (var i=0;i<starts.length;i++) for(var j=0;j<ends.length;j++) titles.push(starts[i]+' | '+ends[j]);
  var pool=[], count=0;
  function generate() {
    if(!pool.length) { pool=titles.filter(function(t){return t!==el('title').value;}); }
    var idx=Math.floor(Math.random()*pool.length);
    el('title').value=pool.splice(idx,1)[0];
    el('count').textContent='Generación #'+(++count);
  }
  el('generate').addEventListener('click',generate);
  function status(msg){el('status').textContent=msg;}
  function fallbackCopy(field, label) {
    field.focus(); field.select(); field.setSelectionRange(0,field.value.length);
    try { if(document.execCommand('copy')) {status(label+' copiado ✓');return;} } catch(e){}
    status('Texto seleccionado. Mantén pulsado y elige Copiar.');
  }
  function copy(id,label){
    var field=el(id);
    try {
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(field.value).then(function(){status(label+' copiado ✓');},function(){fallbackCopy(field,label);});
        return;
      }
    }catch(e){}
    fallbackCopy(field,label);
  }
  el('copyTitle').addEventListener('click',function(){copy('title','Título');});
  el('copyDesc').addEventListener('click',function(){copy('desc','Descripción');});
  try {var saved=localStorage.getItem('estore-description');if(saved!==null)el('desc').value=saved;} catch(e){}
  el('desc').addEventListener('input',function(){try{localStorage.setItem('estore-description',el('desc').value);}catch(e){}});
  el('jsnotice').style.display='none';
  generate();
})();
</script></body></html>
